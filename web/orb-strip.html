<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>THREAD Orb Strip</title>
<style>
  html,body{margin:0;background:#060a12;color:#eef4fb;font:14px "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
  .strip{display:grid;grid-template-columns:repeat(6,1fr);gap:0;padding:28px 24px 26px;background:radial-gradient(1200px 400px at 50% 0,#10213d66,transparent 70%)}
  figure{margin:0;display:grid;justify-items:center;gap:6px}
  canvas{width:240px;height:240px;display:block;margin:-18px 0 -34px}
  b{font-weight:600;font-size:15px;letter-spacing:.02em} small{color:#93a6bf;font-size:12px;text-align:center;max-width:210px;line-height:1.4}
</style></head><body>
<!-- Generates docs/images/orb-states.png (headless screenshot). Each orb is set to one real phase of the app. -->
<div class="strip" id="strip"></div>
<script type="module">
import {createOrb} from './orb.js';
// ?bg=090d13 matches a slide background (hex, no #).
const bg = new URLSearchParams(location.search).get('bg');
if (/^[0-9a-f]{6}$/i.test(bg || '')) { document.body.style.background = '#' + bg; document.documentElement.style.background = '#' + bg; document.getElementById('strip').style.background = 'none'; }
const STATES = [
  ['listening', 'Listening', 'Threads follow your voice level'],
  ['thinking', 'Thinking', 'Twists while the planner works'],
  ['held', 'Held', 'Amber while a correction holds it'],
  ['working', 'Working', 'A tool call is in flight'],
  ['speaking', 'Speaking', 'Barge in any time; it flattens and stops'],
  ['error', 'Failed', 'Says so; never claims success'],
];
for (const [phase, title, note] of STATES) {
  const fig = document.createElement('figure'), canvas = document.createElement('canvas');
  fig.innerHTML = `<b>${title}</b><small>${note}</small>`; fig.prepend(canvas);
  document.getElementById('strip').append(fig);
  const orb = createOrb(canvas, {theme: 'dark', image: 'images/thread-sphere.png', scale: .62});
  orb.setPhase(phase);
  if (phase === 'speaking' || phase === 'listening') orb.setLevel(.55);
}
</script></body></html>
